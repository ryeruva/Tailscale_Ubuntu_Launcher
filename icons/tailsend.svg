<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0f1015" />
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5c1" />
      <stop offset="100%" stop-color="#00c0a5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#2b2d3a" stroke-width="2" />

  <!-- Subtle Mesh Nodes in Background -->
  <g opacity="0.28" stroke="#00c0a5" stroke-width="1.5">
    <line x1="16" y1="20" x2="32" y2="12" />
    <line x1="32" y1="12" x2="48" y2="20" />
    <line x1="16" y1="44" x2="32" y2="52" />
    <line x1="32" y1="52" x2="48" y2="44" />
    <circle cx="16" cy="20" r="3" fill="#00c0a5" />
    <circle cx="32" cy="12" r="3" fill="#00c0a5" />
    <circle cx="48" cy="20" r="3" fill="#00c0a5" />
    <circle cx="16" cy="44" r="3" fill="#00c0a5" />
    <circle cx="32" cy="52" r="3" fill="#00c0a5" />
    <circle cx="48" cy="44" r="3" fill="#00c0a5" />
  </g>

  <!-- Paper Plane / File Share Symbol -->
  <g filter="url(#glow)">
    <path d="M14,31 L50,15 L39,50 L30,36 L14,31 Z" fill="url(#teal-grad)" opacity="0.92" />
    <path d="M50,15 L30,36 L30,46 L35,39" fill="#008e7a" />
    <line x1="50" y1="15" x2="30" y2="36" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
